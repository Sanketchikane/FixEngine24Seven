<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Fixengine24*7</title>

    <link rel="stylesheet" href="static/css/auth.css">

    <script src="static/js/db.js"></script>
    <script src="static/js/auth.js"></script>
</head>

<body>
<div class="fade-bg"></div>

<div class="auth-box">

    <div class="back-btn" onclick="history.back()">← Back</div>

    <img src="static/images/newlogo.png" class="auth-logo">
    <h2>Reset Password</h2>

    <form onsubmit="forgotPassword(event)">

        <div class="input-group">
            <label>Enter Username</label>
            <input type="text" id="fp_username" required>
        </div>

        <button class="btn-primary">Reset Password</button>

        <div class="auth-links">
            <a href="login.html">Back to Login</a>
        </div>

    </form>

</div>

</body>
</html>
