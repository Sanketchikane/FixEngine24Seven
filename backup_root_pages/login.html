<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Fixengine24×7</title>

    <link rel="stylesheet" href="static/css/auth.css">

    <!-- MUST load DB first -->
    <script src="static/js/db.js"></script>

    <!-- WAIT UNTIL DB IS READY (prevents login failure) -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                console.log("🔄 Initializing Database...");
                await openDB();
                await waitForDB();
                console.log("✔ Database Ready");
            } catch (e) {
                console.error("DB Init Error:", e);
            }
        });
    </script>

    <!-- Session system -->
    <script src="static/js/session.js"></script>

    <!-- AUTH MUST load LAST -->
    <script src="static/js/auth.js"></script>

    <style>
        /* ------------------------------
            PREMIUM LOGIN UI / UX
        ------------------------------- */

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #003366, #0055aa);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background subtle fade */
        .fade-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('static/images/registerback.jpg') center/cover no-repeat;
            opacity: 0.18;
        }

        /* Main box */
        .auth-box {
            position: relative;
            width: 380px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.90);
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.22);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(10px);}
            to   {opacity: 1; transform: translateY(0);}
        }

        /* Logo */
        .auth-logo {
            width: 110px;
            display: block;
            margin: 0 auto 10px auto;
        }

        h2 {
            text-align: center;
            margin: 10px 0 25px 0;
            font-size: 26px;
            font-weight: 600;
            color: #003366;
        }

        /* Form design */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #003366;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #bfbfbf;
            font-size: 15px;
            margin-top: 6px;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #0077ff;
            box-shadow: 0 0 0 2px rgba(0,119,255,0.25);
            outline: none;
        }

        /* Login Button */
        .btn-primary {
            width: 100%;
            background: #0077ff;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: #005ad1;
        }

        /* Back Button */
        .back-btn {
            font-size: 15px;
            color: #003366;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            font-weight: 600;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* FOOTER LINKS */
        .auth-links {
            margin-top: 18px;
            text-align: center;
        }

        .auth-links a {
            color: #003366;
            font-weight: 600;
            margin: 0 10px;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="fade-bg"></div>

<div class="auth-box">

    <div class="back-btn" onclick="window.location.href='index.html'">← Back</div>

    <img src="static/images/logo1.png" class="auth-logo">
    <h2>Login</h2>

    <form onsubmit="login(event)">

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login_username" required autofocus>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login_password" required>
        </div>

        <button class="btn-primary">Login</button>

        <div class="auth-links">
            <a href="forgot_password.html">Forgot Password?</a>
            <a href="register.html">Create Account</a>
        </div>

    </form>

</div>

</body>
</html>
