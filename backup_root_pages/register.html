<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Fixengine24×7</title>

    <link rel="stylesheet" href="static/css/auth.css">

    <!-- DB MUST LOAD FIRST -->
    <script src="static/js/db.js"></script>

    <!-- Session + Auth -->
    <script src="static/js/session.js"></script>
    <script src="static/js/auth.js"></script>
</head>

<body>

<!-- Background Blur -->
<div class="fade-bg"></div>

<!-- Registration Box -->
<div class="auth-box">

    <div class="back-btn" onclick="window.location.href='index.html'">← Back</div>

    <img src="static/images/logo1.png" class="auth-logo">

    <h2>Create Account</h2>

    <form onsubmit="registerUser(event)">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="reg_name" placeholder="Enter full name" required>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="reg_username" placeholder="Choose a username" required>
        </div>

        <div class="input-group">
            <label>Contact Number</label>
            <input type="text" id="reg_contact" placeholder="Enter phone number" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="reg_password" placeholder="Create a password" required>
        </div>

        <div class="input-group">
            <label>Select Role</label>
            <select id="reg_role">
                <option value="user">User</option>
                <option value="serviceman">Serviceman</option>
            </select>
        </div>

        <button class="btn-primary">Register</button>

        <div class="auth-links">
            Already registered?
            <a href="login.html">Login</a>
        </div>

    </form>

</div>

</body>
</html>
